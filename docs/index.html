<!DOCTYPE html>
<html lang="en"> <!-- just-update -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <meta http-equiv="refresh" content="5; url=https://bugfishtm.github.io/suitefish-website/" />
  <link rel="canonical" href="https://bugfishtm.github.io/suitefish-website/" />
  <meta name="robots" content="noindex, follow" />

  <title>Suitefish — Redirecting</title>
  <meta name="description" content="Suitefish CMS has moved. You are being redirected to the new website." />
  <meta name="author" content="bugfishtm" />
  <meta name="theme-color" content="#E85D1A" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Suitefish CMS" />
  <meta property="og:title" content="Suitefish CMS — Redirecting" />
  <meta property="og:description" content="Suitefish CMS has moved. You are being redirected to the new website." />
  <meta property="og:url" content="https://bugfishtm.github.io/suitefish-website/" />
  <meta property="og:image" content="https://bugfishtm.github.io/suitefish-docs/meta.jpg" />
  <meta property="og:image:alt" content="Suitefish CMS" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Suitefish CMS — Redirecting" />
  <meta name="twitter:description" content="Suitefish CMS has moved. You are being redirected to the new website." />
  <meta name="twitter:image" content="https://bugfishtm.github.io/suitefish-docs/meta.jpg" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:      #E85D1A;
      --orange-dark: #B8400E;
      --orange-glow: #FF7A35;
      --bg:          #0f0f0f;
      --surface:     #1a1a1a;
      --border:      #2e2e2e;
      --text:        #f0f0f0;
      --muted:       #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    /* animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,93,26,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,93,26,.06) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: grid-drift 20s linear infinite;
      z-index: 0;
    }
    @keyframes grid-drift {
      from { background-position: 0 0; }
      to   { background-position: 48px 48px; }
    }

    /* radial glow behind card */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(232,93,26,.18) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 56px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(232,93,26,.15),
        0 8px 40px rgba(0,0,0,.6),
        0 0 80px rgba(232,93,26,.08);
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 110px; height: 110px;
      background: radial-gradient(circle, rgba(232,93,26,.2) 0%, transparent 70%);
      border-radius: 50%;
      margin-bottom: 28px;
    }
    .logo-wrap img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(232,93,26,.5));
      animation: float 3.6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .badge {
      display: inline-block;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--orange);
      background: rgba(232,93,26,.1);
      border: 1px solid rgba(232,93,26,.3);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: .5px;
      color: #fff;
      margin-bottom: 6px;
    }
    h1 span {
      color: var(--orange);
    }

    .divider {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, var(--orange-dark), var(--orange-glow));
      border-radius: 2px;
      margin: 22px auto;
    }

    .message {
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.6;
    }
    .message strong {
      color: var(--text);
      font-weight: 600;
    }

    .countdown {
      display: block;
      margin-top: 14px;
      font-size: .85rem;
      color: var(--muted);
    }
    .countdown b {
      color: var(--orange);
      font-weight: 700;
    }

    .progress {
      position: relative;
      width: 100%;
      height: 3px;
      margin-top: 22px;
      background: rgba(255,255,255,.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress i {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--orange-dark), var(--orange-glow));
      transform-origin: left center;
      animation: fill 5s linear forwards;
    }
    @keyframes fill {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    .cta {
      display: inline-block;
      margin-top: 26px;
      font-size: .9rem;
      font-weight: 600;
      color: var(--orange);
      text-decoration: none;
      border: 1px solid rgba(232,93,26,.4);
      border-radius: 999px;
      padding: 10px 22px;
      transition: background .2s ease, color .2s ease;
    }
    .cta:hover, .cta:focus-visible {
      background: rgba(232,93,26,.12);
      color: var(--orange-glow);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 32px;
      font-size: .75rem;
      color: #444;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before, .logo-wrap img { animation: none; }
      .progress i { animation: none; transform: scaleX(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-wrap">
      <img src="logo.png" alt="Suitefish Logo" />
    </div>

    <span class="badge">Redirecting</span>

    <h1>Suite<span>fish</span> CMS</h1>

    <div class="divider"></div>

    <p class="message">
      This page has <strong>moved</strong>.<br />
      You are being redirected to the new website.
      <span class="countdown">Redirecting in <b id="secs">5</b> seconds&hellip;</span>
    </p>

    <div class="progress"><i></i></div>

    <a class="cta" href="https://bugfishtm.github.io/suitefish-website/">Go there now &rarr;</a>
  </div>

  <p class="footer">&copy; 2026 Suitefish CMS &mdash; bugfishtm</p>

  <script>
    (function () {
      var target = 'https://bugfishtm.github.io/suitefish-website/';
      var el = document.getElementById('secs');
      var left = 5;

      var tick = setInterval(function () {
        left -= 1;
        if (el) el.textContent = left < 0 ? 0 : left;
        if (left <= 0) {
          clearInterval(tick);
          window.location.replace(target);
        }
      }, 1000);
    })();
  </script>

</body>
</html>

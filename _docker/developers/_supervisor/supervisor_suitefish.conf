[program:suitefish]
command=/bin/sh -c 'while true; do /usr/local/bin/php /var/www/html/_core/worker.php; sleep 5; done'
user=root
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stderr_logfile=/var/log/supervisor_suitefish_error.log
stderr_logfile_maxbytes=50MB
stdout_logfile=/var/log/supervisor_suitefish_info.log
stdout_logfile_maxbytes=50MB
environment=SUITEFISH_SUPERVISOR_LOG_FILE="/var/log/supervisor_suitefish_info.log",SUITEFISH_SUPERVISOR_ERROR_FILE="/var/log/supervisor_suitefish_error.log",SUITEFISH_WEBSERVER_USER="www-data",SUITEFISH_WEBROOT="/var/www/html"